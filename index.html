<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Alien Motorsport - Calculadora de Combustível 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
        background-image: 
          linear-gradient(135deg, rgba(10, 10, 10, 0.85) 0%, rgba(26, 26, 26, 0.85) 50%, rgba(15, 15, 15, 0.85) 100%),
          url("images/Alien.png");
        background-size: cover, cover;
        background-position: center, center;
        background-attachment: fixed, fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        position: relative;
        overflow-x: hidden;
      }

      /* Subtle animated background overlay */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
      }

      .wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 500px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
        animation: fadeInDown 0.8s ease-out;
      }

      .logo-container {
        position: relative;
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .logo-container:hover {
        border-color: rgba(255, 255, 255, 0.35);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .logo {
        width: 85px;
        height: 85px;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
      }

      .header h1 {
        font-size: 30px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1.5px;
        margin-bottom: 6px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        line-height: 1.2;
      }

      .header p {
        font-size: 12px;
        color: #bbb;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 500;
      }

      .container {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(250, 250, 250, 0.98) 100%);
        padding: 40px 28px;
        border-radius: 14px;
        box-shadow: 
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 1px rgba(255, 255, 255, 0.5) inset;
        border: 1px solid rgba(255, 255, 255, 0.35);
        animation: fadeInUp 0.8s ease-out;
        backdrop-filter: blur(10px);
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group:last-of-type {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-size: 11px;
        color: #333;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        padding: 13px 14px;
        font-size: 15px;
        border: 2px solid #e5e5e5;
        border-radius: 7px;
        background-color: #ffffff;
        color: #333;
        font-family: "Poppins", sans-serif;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        background-color: #fafafa;
      }

      input::placeholder {
        color: #bbb;
      }

      select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 18px;
        padding-right: 38px;
      }

      button {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
        color: #fff;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
        font-family: "Poppins", sans-serif;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
      }

      button:hover::before {
        left: 100%;
      }

      button:hover {
        background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.28);
      }

      .resultado {
        background: linear-gradient(135deg, #f9f9f9 0%, #f5f5f5 100%);
        border: 2px solid #000;
        border-radius: 9px;
        padding: 22px;
        margin-top: 26px;
        display: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }

      .resultado.show {
        display: block;
        animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .resultado-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid #e5e5e5;
      }

      .resultado-item:last-child {
        border-bottom: none;
      }

      .resultado-label {
        font-size: 11px;
        color: #666;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .resultado-valor {
        font-size: 20px;
        font-weight: 700;
        color: #000;
        font-family: "Poppins", sans-serif;
        letter-spacing: 0.5px;
      }

      .footer {
        text-align: center;
        margin-top: 32px;
        font-size: 10px;
        color: #999;
        letter-spacing: 0.5px;
        animation: fadeIn 1s ease-out 0.3s both;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        body {
          padding: 12px;
        }

        .wrapper {
          max-width: 100%;
        }

        .header {
          margin-bottom: 28px;
        }

        .header h1 {
          font-size: 26px;
          letter-spacing: 1px;
        }

        .header p {
          font-size: 11px;
        }

        .logo-container {
          width: 100px;
          height: 100px;
          margin-bottom: 16px;
        }

        .logo {
          width: 75px;
          height: 75px;
        }

        .container {
          padding: 32px 22px;
          border-radius: 12px;
        }

        .form-group {
          margin-bottom: 20px;
        }

        label {
          font-size: 10px;
          margin-bottom: 8px;
        }

        input,
        select {
          padding: 12px 12px;
          font-size: 14px;
          border-radius: 6px;
        }

        button {
          padding: 13px;
          font-size: 13px;
          border-radius: 6px;
          margin-top: 8px;
        }

        .resultado {
          padding: 18px;
          border-radius: 8px;
          margin-top: 22px;
        }

        .resultado-item {
          padding: 11px 0;
        }

        .resultado-label {
          font-size: 10px;
        }

        .resultado-valor {
          font-size: 18px;
        }

        .footer {
          margin-top: 28px;
          font-size: 9px;
        }
      }

      @media (max-width: 400px) {
        .header h1 {
          font-size: 22px;
          letter-spacing: 0.5px;
        }

        .container {
          padding: 26px 18px;
        }

        .logo-container {
          width: 90px;
          height: 90px;
        }

        .logo {
          width: 65px;
          height: 65px;
        }

        input,
        select {
          padding: 11px 10px;
          font-size: 13px;
        }

        button {
          padding: 12px;
          font-size: 12px;
        }

        .resultado-valor {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <div class="logo-container">
          <div class="logo">
            <img src="images/Alien.png" alt="Alien Motorsport Logo" />
          </div>
        </div>
        <h1>Alien Motorsport</h1>
        <p>Calculadora de Combustível 2026</p>
      </div>

      <div class="container">
        <div class="form-group">
          <label for="tipo">Tipo de Mistura:</label>
          <select id="tipo">
            <option value="E40">E40</option>
            <option value="E50">E50</option>
            <option value="E63">E63</option>
            <option value="E70">E70</option>
            <option value="E75">E75</option>
            <option value="E80" selected>E80</option>
            <option value="E85">E85</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantidade1">Quantidade de Litros:</label>
          <input 
            type="number" 
            id="quantidade1" 
            min="0" 
            step="0.1"
            placeholder="Ex: 50"
          />
        </div>

        <div class="form-group">
          <label for="tipoGasolina">Tipo de Gasolina:</label>
          <select id="tipoGasolina">
            <option value="Premium" selected>Premium</option>
            <option value="Comum">Comum</option>
          </select>
        </div>

        <button onclick="calcularMistura()">Calcular Mistura</button>

        <div id="resultado" class="resultado">
          <div class="resultado-item">
            <span class="resultado-label" id="resultado-gasolina-label">Gasolina Premium:</span>
            <span class="resultado-valor" id="resultado-gasolina">0L</span>
          </div>
          <div class="resultado-item">
            <span class="resultado-label">Etanol:</span>
            <span class="resultado-valor" id="resultado-etanol">0L</span>
          </div>
          <div class="resultado-item">
            <span class="resultado-label">Total:</span>
            <span class="resultado-valor" id="resultado-total">0L</span>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>© 2026 Alien Motorsport - Todos os direitos reservados</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
